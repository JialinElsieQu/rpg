<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="stylesheet" href="styles.css">
    <title>RPG Battle</title>
  </head>

  <body>
    <div id="game">

      <!-- Statistics -->
      <div id="stats">
        <span class="stat">XP: <strong><span id="xpText">0</span></strong></span>
        <span class="stat">Health: <strong><span id="heathText">100</span></strong></span>
         <span class="stat">Gold: <strong><span id="goldText">50</span></strong></span>
      </div>

      <!-- Game image -->
      <div id="content">
        <img id="img" src="start.png" class="center">
      </div>

      <!-- Buttons -->
      <div id="controls">
        <button id="button1">Go to Shop</button>
        <button id="button2">Go to Cave</button>
        <button id="button3">Go to Castle</button>
        <button id="button4">Final Fight</button>
      </div>

      <!-- Monster information -->
      <div id="mnsterStats">
        <span class="stat">Monster Name: <strong><span id="monsterName"></span></strong></span>
        <span class="stat">Health: <strong><span id="monsterHeath"></span></strong></span>
      </div>

      <!-- Instructions and stuff -->
      <div id="text">
        Welcome to your RPG adventure! You are in the town square.
        Where do you want to go? Use the buttons above.
      </div>

      <script src="app.js"></script>
    </div>
        
        
      </body>
    

</html>
